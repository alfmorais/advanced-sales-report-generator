[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vendas-cli"
version = "1.0.0"
description = "CLI that generates sales reports from CSV files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Alfredo" }]
keywords = ["sales", "report", "csv", "cli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.17.4",
]

[project.scripts]
sales-cli = "sales_cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]

[tool.mypy]
python_version = "3.13"
files = ["src"]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["migrations", "mutants", "tests", ".vscode", ".poetry", ".ruff_cache", ".venv", ".env"]
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=sales_cli",
    "--cov-report=term-missing",
    "--cov-fail-under=80",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sales_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 79
extend-exclude = ["migrations"]

[tool.ruff.lint]
preview = true
select = ["I", "F", "E", "W", "PL", "PT"]

[tool.ruff.format]
preview = true
quote-style = "double"

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 79
known_first_party = ["src"]
default_section = "THIRDPARTY"
